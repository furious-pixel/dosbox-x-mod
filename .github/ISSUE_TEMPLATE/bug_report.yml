name: Fork bug report
description: A bug in this experimental fork (Python mods, presentation, CRT, Windows x64 SDL2)
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        This is an experimental fork, not official DOSBox-X.
        Vanilla emulator bugs belong on https://github.com/joncampbell123/dosbox-x/issues
  - type: textarea
    id: issue
    attributes:
      label: Describe the bug
      description: What went wrong in this fork?
    validations:
      required: true
  - type: checkboxes
    id: upstream
    attributes:
      label: Scope
      options:
        - label: This is not a vanilla DOSBox-X bug (those go upstream).
          required: true
