name: Fork feature request
description: A change to this experimental fork (not official DOSBox-X)
labels: ["feature request"]
body:
  - type: markdown
    attributes:
      value: |
        This is an experimental fork, not official DOSBox-X.
        Vanilla features belong on https://github.com/joncampbell123/dosbox-x/issues
  - type: textarea
    id: issue
    attributes:
      label: What you want
      description: Describe the fork-specific change.
    validations:
      required: true
  - type: checkboxes
    id: upstream
    attributes:
      label: Scope
      options:
        - label: This is not a vanilla DOSBox-X feature request (those go upstream).
          required: true
