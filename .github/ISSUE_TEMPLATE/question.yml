name: Fork question
description: A question about this experimental fork
labels: question
body:
  - type: markdown
    attributes:
      value: |
        This is an experimental fork, not official DOSBox-X.
        General DOSBox-X usage questions belong on https://github.com/joncampbell123/dosbox-x or https://dosbox-x.com/wiki
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Ask about Python mods, presentation views, native CRT, or the Windows x64 SDL2 build.
    validations:
      required: true
