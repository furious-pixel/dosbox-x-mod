# The only automatic build for this fork: Visual Studio x64 Release SDL2.
name: Windows x64 SDL2

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v2
      - name: Prepare build timestamp
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "package_stem=dosbox-x-windows-x64-sdl2-${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            echo "package_stem=dosbox-x-windows-x64-sdl2-$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV
          fi
          echo "timestamp=`git show -s --format=%at | xargs -I# date -d @# +%Y%m%d%H%M%S`" >> $GITHUB_ENV
          export shortsha=`echo ${GITHUB_SHA} | cut -c1-7`
          export copyrightyear=`git show -s --format=%at | xargs -I# date -d @# +'%Y'`
          export updatestr=`git show -s --format=%at | xargs -I# date -d @# +'%b %d, %Y %I:%M:%S%P'`
          echo '/* auto generated */' > include/build_timestamp.h
          echo "#define UPDATED_STR \"${updatestr}\"" >> include/build_timestamp.h
          echo "#define GIT_COMMIT_HASH \"${shortsha}\""  >> include/build_timestamp.h
          echo "#define COPYRIGHT_END_YEAR \"${copyrightyear}\"" >> include/build_timestamp.h
          cat include/build_timestamp.h
      - name: Build Visual Studio x64 SDL2
        shell: pwsh
        run: |
          msbuild -m vs/dosbox-x.sln -t:dosbox-x:Rebuild -p:Configuration="Release SDL2" -p:Platform=x64
          if ($LASTEXITCODE) { throw 'Host build failed' }
          if (-not(Test-Path -Path 'bin\x64\Release SDL2\dosbox-x.exe' -PathType Leaf)) { exit 1 }
          contrib\windows\installer\PatchPE.exe 'bin\x64\Release SDL2\dosbox-x.exe'
      - name: Package
        run: |
          ./tools/package_windows_sdl2.ps1 -Destination package
          if ($LASTEXITCODE) { throw 'Host staging failed' }
          $manifest = Get-Content package/HOST_BUILD_INFO.json -Raw | ConvertFrom-Json
          if (@($manifest.worktree_changes).Count) { throw 'Unexpected host source modifications' }
          Compress-Archive -Path package/* -DestinationPath "${{ env.package_stem }}.zip"
          git archive --format=tar --output=host-source.tar HEAD
          if ($LASTEXITCODE) { throw 'Host source archive failed' }
          New-Item -ItemType Directory source-stage | Out-Null
          tar -xf host-source.tar -C source-stage
          if ($LASTEXITCODE) { throw 'Host source extraction failed' }
          Copy-Item include/build_timestamp.h source-stage/include/build_timestamp.h
          Copy-Item package/HOST_BUILD_INFO.json source-stage/HOST_BUILD_INFO.json
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Join-Path $PWD 'source-stage'), (Join-Path $PWD '${{ env.package_stem }}-source.zip'))
          Get-ChildItem "${{ env.package_stem }}*.zip" | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
      - name: Upload package
        uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ env.package_stem }}
          path: |
            ${{ github.workspace }}/${{ env.package_stem }}*.zip
            ${{ github.workspace }}/${{ env.package_stem }}*.sha256
      - name: Attach zip to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.package_stem }}*.zip
            ${{ env.package_stem }}*.sha256
          prerelease: true
